<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#161c2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="block1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc"/>
      <stop offset="100%" stop-color="#4a3fd6"/>
    </linearGradient>
    <linearGradient id="block2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0fa8c2"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Three stacked blockchain blocks, slightly offset like linked blocks -->
  <rect x="12" y="34" width="14" height="14" rx="2" fill="url(#block1)" opacity="0.9"/>
  <rect x="24" y="26" width="14" height="14" rx="2" fill="url(#block2)" opacity="0.9"/>
  <rect x="18" y="18" width="14" height="14" rx="2" fill="#8f85ff" opacity="0.85"/>

  <!-- connecting link lines between blocks, like a chain -->
  <line x1="25" y1="32" x2="19" y2="38" stroke="#0b0f1a" stroke-width="2"/>
  <line x1="31" y1="24" x2="25" y2="30" stroke="#0b0f1a" stroke-width="2"/>

  <!-- Lens: magnifying glass ring over the blocks -->
  <circle cx="34" cy="36" r="14" fill="rgba(11,15,26,0.15)" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="34" cy="36" r="14" fill="none" stroke="#0b0f1a" stroke-width="1" opacity="0.4"/>
  <line x1="44" y1="46" x2="53" y2="55" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"/>

  <!-- small highlight arc on the lens glass for a glossy look -->
  <path d="M 26 30 A 10 10 0 0 1 34 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
